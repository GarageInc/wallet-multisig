# Read for more details:
# https://www.digitalocean.com/community/tutorials/how-to-automate-your-node-js-production-deployments-with-shipit-on-centos-7

---
- hosts: cosigner_prod_api
  vars:
    sys_packages: [ 'rsync' ]
    deploy_dir: /var/www/signer.whalesheaven.com/current

  tasks:
    - name: Install required system packages
      become: true
      apt:
        name: "{{ sys_packages }}"
        state: latest

    - name: Install/Upgrade pm2 package(s)
      become: true
      npm:
        name: "{{ item }}"
        global: yes
        state: present
      with_items:
        - pm2
        - pmx

    - name: Ensure pm2 is not running
      command: pm2 kill
      become: false

    - name: Remove old artifacts from the ansible user's .pm2 directory
      file:
        path: /home/{{ ansible_user }}/.pm2/{{ item }}
        state: absent
      become: false
      with_items:
        - dump.pm2
        - dump.pm2.bak
        - pm2.log
        - pm2.pid
        - touch

    - name: Install pm2-logrotate using PM2
      command: pm2 install pm2-logrotate
      become: false
      args:
        chdir: "{{ deploy_dir }}"
